name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      BETTER_AUTH_SECRET: ci-placeholder-secret
      SPOTIFY_CLIENT_ID: ci-placeholder
      SPOTIFY_CLIENT_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx svelte-check --threshold error
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wikebox .
