<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
			Wikebox landing page
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content padding>
  Welcome to the members only area!
 
  <p>{{ data }}</p>
<!-- Estes botóns son só de proba, a ver se vai ben o tema do token cos usuarios --> 
  <ion-button expand="full" (click)="isLoggedIn()">Is logged in?</ion-button>
  <ion-button expand="full" (click)="logout()">Logout</ion-button>
  <ion-button expand="full" (click)="clearToken()">Clear JWT</ion-button>
  <ion-button expand="full" (click)="get_data()">Get data</ion-button>
 
</ion-content>
