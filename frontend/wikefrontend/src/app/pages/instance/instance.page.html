<ion-header>
	<ion-toolbar>
		<ion-title>instance</ion-title>
	</ion-toolbar>
</ion-header>

<ion-content>
	<div style="text-align:left;background-color:black;color:var(--ion-color-app);padding-top:0.5%;padding-bottom:0.5%;border-bottom: 1px solid var(--ion-color-app);">
		<ion-row>
			<ion-col size="1">
				<ion-img style="width: 100%;" src="assets/images/jukebox_icon.png"></ion-img>
			</ion-col>
			<ion-col size="1" class="ion-align-self-center">
				<p style="font-size:150%;">Wikebox</p>
			</ion-col>
			<ion-col offset="2" size="5" class="ion-align-self-center">
			</ion-col>
			<ion-col offset="2" class="ion-align-self-center">
				username
			</ion-col>
		</ion-row>
	</div>
	<div>
		<ion-row class="ion-justify-content-center">
			<ion-col size="5">
				<div style="text-align:center">Welcome to Wikebox, you need to create a Wike to play music.</div>
				<form #form="ngForm" (ngSubmit)="instance(form)" method="post">
					<ion-item style="margin-top:10%">
            <ion-input name="instance" type="text" placeholder="Instance" ngModel required></ion-input>
					</ion-item>
					<!-- <ion-item> -->
            <!-- <ion-input name="password" type="password" placeholder="Password" ngModel required></ion-input> -->
          <!-- </ion-item> -->
				</form>
				<ion-row>
					<ion-col>
						<ion-button style="margin-left:10%;margin-right:10%" type="submit" [disabled]="form.invalid" (click)="instance(form)" expand="block" size="default" color="app">Register instance</ion-button>
					</ion-col>
					<ion-col>
						<ion-button style="margin-left:10%;margin-right:10%" type="click" (click)="login()" expand="block" size="default" color="app">Login</ion-button>
					</ion-col>
				</ion-row>
			</ion-col>
		</ion-row>
	</div>
</ion-content>
