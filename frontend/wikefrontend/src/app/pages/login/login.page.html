<ion-content>
	<div style="text-align:center;background-color:var(--ion-color-tertiary);color:white;padding-top:0.5%;padding-bottom:0.5%;border-bottom: 1px solid rgb(220,220,220);">
		<p style="font-size:120%;">L O G I N</p>
	</div>
	<form #form="ngForm" (ngSubmit)="login(form)" method="post">
		<ion-item style="margin-top:5%">
			<ion-label position="floating">Username</ion-label>
			<ion-input style=" text-align:center" ngModel type="text" name="username"></ion-input>
		</ion-item>

		<ion-item style="margin-bottom:10%">
			<ion-label position="floating">Password</ion-label>
			<ion-input style=" text-align:center" ngModel type="password" name="password"></ion-input>
		</ion-item>
	</form>
	<ion-button style="margin-left:10%;margin-right:10%" type="submit" (click)="login(form)" expand="full" color="tertiary">Login</ion-button>

	<ion-row>
		<div text-center>
			If you don't have an account, please <a routerLink='/register'>	register</a> first!
		</div>
	</ion-row>
</ion-content>
