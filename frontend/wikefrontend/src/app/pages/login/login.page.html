<ion-content>
	<div style="text-align:center;background-color:black;color:var(--ion-color-app);padding-top:0.5%;padding-bottom:0.5%;border-bottom: 1px solid var(--ion-color-app);">
		<p style="font-size:200%;">Welcome to Wikebox</p>
	</div>
	<div>
		<ion-row class="ion-justify-content-center">
			<ion-col size="5">
				<form #form="ngForm" (ngSubmit)="login(form)" method="post">
					<ion-item style="margin-top:10%">
            <ion-input name="username" type="text" placeholder="Username" ngModel required></ion-input>
					</ion-item>
					<ion-item style="margin-bottom:5%">
            <ion-input name="password" type="password" placeholder="Password" ngModel required></ion-input>
					</ion-item>
				</form>
				<ion-row>
					<ion-col>
						<ion-button style="margin-left:10%;margin-right:10%" type="submit" [disabled]="form.invalid" (click)="login(form)" expand="block" size="default" color="app">Login</ion-button>
					</ion-col>
					<ion-col>
						<ion-button style="margin-left:10%;margin-right:10%" type="submit" [routerLink]="['/register']" expand="block" size="default" color="app">New user</ion-button>
					</ion-col>
				</ion-row>
			</ion-col>
		</ion-row>
	</div>
</ion-content>
