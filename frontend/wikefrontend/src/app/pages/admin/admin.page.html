<ion-content>
	<div style="text-align:left;background-color:black;color:var(--ion-color-app);padding-top:0.5%;padding-bottom:0.5%;border-bottom: 1px solid var(--ion-color-app);">
		<ion-row>
			<ion-col size="1">
				<ion-img style="width: 100%;" src="assets/images/jukebox_icon.png"></ion-img>
			</ion-col>
			<ion-col size="1" class="ion-align-self-center">
				<p style="font-size:150%;">Wikebox</p>
			</ion-col>
			<ion-col offset="2" size="5" class="ion-align-self-center">

				<!-- Search bar and show results -->
				<ion-searchbar [(ngModel)]="searchTerm" [debounce]="500" (ionChange)="searchChanged($event)" placeholder="Search a song" showCancelButton="focus"></ion-searchbar>
				<ion-list>
					<ion-item button (click)="clickSearchSong(item.value.uri)" *ngFor="let item of (results | async)">
						<ion-label>
							<h2>{{ item.value.song }}</h2>
							<h6>{{ item.value.artists }}</h6>
						</ion-label>
					</ion-item>
				</ion-list>

			</ion-col>
		</ion-row>
	</div>
	<!-- <ion-label>Playlists</ion-label> -->
	<!-- <ion-list> -->
	<!-- 	<ion-item *ngFor="let playlist of (playlists | async)"> -->
	<!-- 		<ion-label>{{playlist.value.playlist}}</ion-label> -->
	<!-- 	</ion-item> -->
	<!-- </ion-list> -->


	<!-- Select playlists -->
	<ion-item>
		<ion-label>Playlists</ion-label>
		<ion-select #C placeholder="choose a playlist" interface="action-sheet" (ionChange)="getPlaylistSongs(C.value)" (ionFocus)="getPlaylists()">
			<!-- Probablemente non necesite isto vvv -->
			<!-- <ion-select-option value="New">New playlist</ion-select-option> -->
			<ion-select-option *ngFor="let playlist of (playlists | async)" value={{playlist.value.playlistId}} >{{playlist.value.playlist}}</ion-select-option>
		</ion-select>
	</ion-item>

	<!-- Show playlists -->
	<ion-list *ngFor="let song of ( playlistSongs | async)">
		<ion-item>
			<ion-grid>
				<ion-row >
					<ion-col>
						<ion-label text-wrap>
							<h2>{{ song.value.song }}</h2>
							<h6>{{ song.value.artists }}</h6>
						</ion-label>
					</ion-col>
					<ion-col size=1 >
						<ion-button color="light" >
							-
						</ion-button>
					</ion-col>
						<ion-col size=1 >
							<ion-label>
								<h2>00</h2>
							</ion-label>
						</ion-col>
						<ion-col size=1 >
							<ion-button color="light" >
								+
							</ion-button>
						</ion-col>
				</ion-row>
			</ion-grid>
		</ion-item>
	</ion-list>

	<ion-infinite-scroll threshold="100px" (ionInfinite)="infinitesongs($event)">
		<ion-infinite-scroll-content
			loadingSpinner="crescent"
			loadingText="Loading more data...">
		</ion-infinite-scroll-content>
	</ion-infinite-scroll>

</ion-content>
