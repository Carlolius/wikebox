<ion-header [translucent]="true">
  <ion-toolbar>
  </ion-toolbar>
</ion-header>
<ion-content>
	<div style="text-align:center;background-color:var(--ion-color-tertiary);color:white;padding-left:5%;padding-top:0.5%;padding-bottom:0.5%;border-bottom: 1px solid rgb(220,220,220);">
		<p style="font-size:120%;">R E G I S T E R</p>
	</div>
	<form #form="ngForm" (ngSubmit)="register(form)" method="post">
		<ion-item style="margin-top:5%">
			<ion-label position="floating">Username</ion-label>
			<ion-input style=" text-align:center" ngModel name="username"></ion-input>
		</ion-item>
		<ion-item>
			<ion-label position="floating">Password</ion-label>
			<ion-input style=" text-align:center" type="password" ngModel name="password" required></ion-input>
		</ion-item>
		<ion-item style="margin-bottom:10%">
			<ion-label position="floating">Repeat password</ion-label>
			<ion-input style=" text-align:center" type="password" ngModel name="confirm" required></ion-input>
		</ion-item>
		<ion-button style="margin-left:10%;margin-right:10%" type="submit" expand="full" (click)="register(form)" color="tertiary">Register</ion-button>
	</form>
</ion-content>
